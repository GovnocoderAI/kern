version: 2

project_name: kern

before:
  hooks:
    - go mod tidy

builds:
  - id: kern
    main: ./cmd/kern
    binary: kern
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/GovnocoderAI/kern/internal/version.Version={{ .Version }}
      - -X github.com/GovnocoderAI/kern/internal/version.Commit={{ .Commit }}
      - -X github.com/GovnocoderAI/kern/internal/version.Date={{ .CommitDate }}

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

nfpms:
  - id: packages
    package_name: kern
    formats:
      - deb
      - rpm
    bindir: /usr/local/bin
    maintainer: Kern Contributors
    description: Fast open-source coding agent for the terminal
    homepage: https://github.com/GovnocoderAI/kern
    license: Apache-2.0
