version: 2

project_name: kern

before:
  hooks:
    - go mod tidy

builds:
  - id: kern
    main: ./cmd/kern
    binary: kern
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/GovnocoderAI/kern/internal/version.Version={{ .Version }}
      - -X github.com/GovnocoderAI/kern/internal/version.Commit={{ .Commit }}
      - -X github.com/GovnocoderAI/kern/internal/version.Date={{ .CommitDate }}

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

# Preview/rc tags are published as GitHub pre-releases automatically, and the
# release notes come from a hand-written file so the page reads like a
# changelog rather than a raw commit dump.
release:
  prerelease: auto
  name_template: "Kern {{ .Tag }}"
  header: |
    **Kern** — a fast, open coding agent for the terminal.

    Preview build: the core agent, providers, tools, permissions, sessions, the
    full-screen TUI, multi-agent roles, a local HTTP/SSE server and an embedded
    web UI all work end to end. The surface is still moving.

    ### Highlights

    - Three front ends: full-screen TUI, `kern run`, and a web UI (`kern serve`)
    - `kern desktop` opens the web UI in an app window
    - Multi-agent roles — plan (read-only), build, test, review — via the `task` tool
    - Skills: markdown prompts with frontmatter, `--skill` or `/skill`
    - OpenAI-compatible, Anthropic and Google Gemini providers
    - Credentials discovered from opencode, `.env`, Codex, Continue, Gemini CLI, Aider
    - Retry with backoff, byte-safe output, symlink-aware workspace sandbox
    - First-run wizard (`kern init`) for theme, provider, key and model

    ### Quick start

    ```bash
    kern init                      # theme, provider, key, model
    kern                           # full-screen TUI
    kern --agent plan "map this repo"
    kern serve --open              # web UI in the browser
    kern desktop                   # web UI in an app window
    kern "summarise this repo"     # one-shot, non-interactive
    ```

  footer: |
    ## Install

    Download the archive for your platform above, or use the installer:

    ```bash
    curl -fsSL https://raw.githubusercontent.com/GovnocoderAI/kern/main/scripts/install.sh | sh
    ```

    ```powershell
    irm https://raw.githubusercontent.com/GovnocoderAI/kern/main/scripts/install.ps1 | iex
    ```

nfpms:
  - id: packages
    package_name: kern
    formats:
      - deb
      - rpm
    bindir: /usr/local/bin
    maintainer: Kern Contributors
    description: Fast open-source coding agent for the terminal
    homepage: https://github.com/GovnocoderAI/kern
    license: Apache-2.0
